<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Harbor Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0d;
    --text: #ece9e4;
    --text-muted: #8f8c86;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  img {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    object-fit: cover;
  }

  a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 18px;
    letter-spacing: 0.04em;
    font-weight: 400;
    transition: color 0.25s ease;
  }

  a:hover {
    color: var(--text);
  }
</style>
</head>
<body>
  <main>
    <img src="https://lh3.googleusercontent.com/a/ACg8ocJwmx7Jl7gDpGhdk4VKJocEZh_6sqC0Zm9Jt1xzVUOT0VtrAC8=s576-c-no" alt="Sonic Harbor Management logo">
    <a href="mailto:main@sonicharbormgmt.com">main@sonicharbormgmt.com</a>
  </main>
</body>
</html>
